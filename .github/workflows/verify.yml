name: verify

# Re-checks every HOL4 proof, compiles the programs with the verified CakeML
# compiler, and tests the resulting binaries.
#
# The toolchain (Poly/ML, HOL4, CakeML and the CakeML theories this project
# depends on) takes a few hours to build, so it is built once into a Docker
# image, pushed to GHCR, and reused until docker/ changes.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (tagged by a hash of docker/)
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          tag=$(find docker -type f ! -name '*.log' | sort | xargs cat | sha256sum | cut -c1-16)
          echo "image=ghcr.io/${owner}/verified-qsort-toolchain:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is the image already built?
        id: exists
        run: |
          if docker manifest inspect '${{ steps.meta.outputs.image }}' > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.exists.outputs.exists == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build and push the toolchain image (first time only; a few hours)
        if: steps.exists.outputs.exists == 'false'
        run: |
          docker build --target ci -t '${{ steps.meta.outputs.image }}' docker
          docker push '${{ steps.meta.outputs.image }}'

  verify:
    name: Proofs, compilation and tests
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check proofs, compile, test
        run: bash ci/check.sh .

      - name: Upload binaries and assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-qsort-${{ github.sha }}
          path: ci-out/
          if-no-files-found: ignore
